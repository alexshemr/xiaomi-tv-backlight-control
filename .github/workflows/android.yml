name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "res/**", "AndroidManifest.xml", "build.ps1", ".github/**", "tests/**"]
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        shell: pwsh
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Restore signing key when configured
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TV_SIGNING_KEY_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          if ($env:SIGNING_KEY) {
            [IO.File]::WriteAllBytes("$PWD/build/local-signing.p12", [Convert]::FromBase64String($env:SIGNING_KEY))
          }
      - name: Key handling tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test | Out-Null
          & "$env:JAVA_HOME/bin/javac" -d build/test src/KeyPanel.java tests/KeyPanelTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java" -cp build/test local.ha.tvbacklight.KeyPanelTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Sdk "$env:ANDROID_HOME" -Jdk "$env:JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-tv-backlight-control-development
          path: build/tv-backlight.apk
